<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面试进行中 · AI 模拟面试</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <div class="topbar">
    <span class="brand">AI 模拟面试</span>
    <nav>
      <a href="index.html">开始面试</a>
      <a href="history.html">面试记录</a>
    </nav>
    <span class="user">
      <span v-if="turn && !turn.finished" class="muted">
        第 {{ turn.questionIndex }}/{{ turn.total }} 题 · 均分 {{ fmtScore(turn.averageScore) }}
      </span>
      <button class="small danger" v-if="turn && !turn.finished" :disabled="submitting"
              @click="finish">结束面试</button>
    </span>
  </div>

  <div class="container">
    <div class="progress-bar" v-if="turn && !turn.finished">
      <div :style="{ width: progress }"></div>
    </div>

    <div v-if="booting" class="card center muted">正在载入面试现场…</div>

    <template v-else-if="turn">
      <div class="card">
        <div class="chat">
          <!-- 上一轮回顾：默认折叠。
               原来这里是一块评分 + 一个孤零零的「你的回答」气泡，位置在当前题目之下，
               新题一出来就读成「新题已经被答过了」。现在整轮（题目 + 回答 + 评分 + 五维）
               收进一个折叠块，默认收起，要看点一下 -->
          <details class="feedback prior" v-if="showPrior">
            <summary>
              上一轮回顾 · 第 {{ turn.lastSeq }} 题 · {{ turn.lastTopic || '综合' }}
              <span class="score" :class="scoreClass(turn.lastScore)">
                {{ fmtScore(turn.lastScore) }}
              </span>
              <span class="tag">{{ NEXT_ACTION_LABELS[turn.nextAction] || turn.nextAction }}</span>
            </summary>
            <div class="prior-body">
              <p class="mt8"><span class="muted">问：</span>{{ turn.lastQuestion }}</p>
              <p class="mt8" style="white-space:pre-wrap">
                <span class="muted">答：</span>{{ turn.lastAnswer || '（未作答）' }}
              </p>
              <p class="mt8" v-if="turn.lastComment">
                <span class="muted">评语：</span>{{ turn.lastComment }}
              </p>
              <div class="dim-grid mt8" v-if="turn.lastDimensions">
                <div class="dim-item" v-for="(v, k) in turn.lastDimensions" :key="k">
                  <span class="k">{{ DIMENSION_LABELS[k] || k }}</span>
                  <span class="v">{{ fmtScore(v) }}</span>
                </div>
              </div>
            </div>
          </details>

          <div class="bubble interviewer" v-if="turn.question">
            <span class="who">
              第 {{ turn.questionIndex }} 题 · {{ turn.topic || '综合' }} · {{ turn.difficulty || '-' }}
            </span>
            {{ turn.question }}
          </div>
        </div>

        <!-- 图跑挂了：进度已落库，能接着答，所以只是提示，不是错误页 -->
        <div v-if="turn.error" class="feedback" style="background:#fdecec;border-color:#f5c2c2">
          {{ turn.error }}
        </div>

        <!-- 语音和打字**不是两个模式**：就一个答题框，麦克风是它右下角常显的图标，
             转写回来的文字落进同一个框、能接着改。
             第一版是模式切换 + 只读转写块，砍掉了 —— 说错一个字就得整段重录，
             而且「语音还是打字」这个选择每题都要做一次，用起来像在跟 UI 较劲。 -->
        <div v-if="!turn.finished" class="actions">
          <div class="answer-box">
            <textarea v-model="answer" :disabled="submitting"
                      placeholder="写下你的回答…　也可以点右下角麦克风说（Ctrl+Enter 提交）"
                      @keydown.ctrl.enter="submit"></textarea>

            <!-- 流式正在说的那半句。**不放 textarea 里** —— 它一直在被改写
                 （「我要用 redis」→「我要用 Redis 做缓存」），写进框里会把用户打的草稿
                 反复搅乱、光标也没了。只有说到停顿定稿了才追加进框（见 asr-stream.js） -->
            <p class="asr-partial" v-if="asrState === 'recording' && asrPartial">{{ asrPartial }}</p>

            <div class="answer-bar">
              <!-- 左边这半是录音状态的提示。说话时不看着点什么，就不知道麦克风有没有在收 -->
              <span class="asr-slot">
                <template v-if="asrState === 'recording'">
                  <span class="asr-meter"><i :style="{ width: (asrLevel * 100) + '%' }"></i></span>
                  <span class="asr-hint">{{ asrSeconds }}s / 最长 {{ asrMaxSeconds }}s，到点自动停</span>
                </template>
                <span class="asr-hint" v-else-if="asrState === 'transcribing'">
                  <span class="spinner dark"></span> 转写中…
                </span>
                <span class="asr-hint" v-else-if="asrState === 'done'">已转写，可以直接改</span>
              </span>

              <!-- 模式选择。放麦克风左边是因为它管的是「这个麦克风怎么工作」。
                   两个都不可用时不显示这个下拉（没得选），那时麦克风按钮也不显示 -->
              <select class="asr-mode" v-if="asrAvailable || asrStreamAvailable"
                      :value="asrMode" @change="asrModeSet($event.target.value)">
                <option value="stream" :disabled="!asrStreamAvailable"
                        :title="asrStreamReason">⚡ 流式</option>
                <option value="offline" :disabled="!asrAvailable">🎙 离线</option>
              </select>

              <!-- 按钮只认 micStart / micStop，走哪条路由 this.asrMode 决定 -->
              <button type="button" class="icon-btn recording"
                      v-if="micAvailable && asrState === 'recording'"
                      title="停止并转写" @click="micStop">⏹</button>
              <button type="button" class="icon-btn" v-else-if="micAvailable"
                      :disabled="submitting || asrState === 'transcribing'"
                      :title="asrState === 'transcribing' ? '转写中…' : '录音回答'"
                      @click="micStart">🎤</button>

              <button :disabled="!canSubmit" @click="submit">
                <span v-if="submitting" class="spinner"></span>
                {{ submitting ? '面试官正在评估…' : '提交' }}
              </button>
            </div>
          </div>

          <!-- 出错就给一条人话。这里不再需要「改用打字」那个逃生按钮 ——
               框一直就在那儿，随手就能接着打 -->
          <p class="asr-error mt8" v-if="asrError">{{ asrError }}</p>

          <p class="muted mt8" v-if="submitting">
            AI 服务繁忙时会自动重试，最长约 1.5 分钟，请勿刷新页面。
          </p>
        </div>
      </div>
    </template>

    <div v-else class="card center">
      <p class="muted">这场面试没能载入。</p>
      <a href="index.html">回到首页</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="js/app.js"></script>
<script src="js/asr.js"></script>
<script src="js/asr-stream.js"></script>
<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        recordId: null,
        turn: null,
        answer: '',
        submitting: false,
        booting: true,
        DIMENSION_LABELS,
        NEXT_ACTION_LABELS,
        ...asrData(),
        ...asrStreamData()
      };
    },
    computed: {
      // 答完第 n 题时进度是 (n-1)/total，最后一题答完跳复盘页，所以不会到 100%
      progress() {
        const t = this.turn;
        if (!t || !t.total) return '0%';
        return Math.min(100, (t.questionIndex - 1) / t.total * 100) + '%';
      },
      // 上一轮和当前题是同一道题时不显示（刚开局还没答过题，或答完最后一题
      // 还没出下一题），否则会和下面的题面重复
      showPrior() {
        const t = this.turn;
        return !!(t && t.lastSeq && t.lastQuestion && t.lastQuestion !== t.question);
      },
      // 提交的就是框里那段。语音的转写结果也落进同一个框（asr.js 的 asrTranscribe），
      // 所以这里不用再分「语音模式交 asrText、打字模式交 answer」
      submitText() { return (this.answer || '').trim(); },
      // 录音 / 转写进行中不给提交：submit 会把 answer 清空，而转写结果随后才到，
      // 那段话就落到下一题去了。按钮的 :disabled 和 Ctrl+Enter 走同一个判断
      canSubmit() {
        return !this.submitting && !!this.submitText
          && this.asrState !== 'recording' && this.asrState !== 'transcribing';
      }
    },
    async mounted() {
      if (!requireLogin()) return;

      const id = new URLSearchParams(location.search).get('id');
      if (!id) {
        location.replace('index.html');
        return;
      }
      this.recordId = id;

      try {
        // 载入现场走 resume，它是幂等的：游标停在 wait_answer 且没有答案时会
        // 立刻挂起并返回当前题目。所以「刷新页面」「关掉再回来」「上次 LLM 失败后
        // 重试」走的都是同一条路径，不需要各写一套。
        this.apply(await api('/api/interview/' + id + '/resume', { method: 'POST' }));
      } catch (e) {
        toast(e.message, true);
        this.booting = false;
      }

      // 先定模式，再拉 /status：顺序反了的话「存着流式但流式没配」那回落判断
      // 就没机会执行，页面进来是「按钮不见了」而离线其实能用
      this.asrModeInit();
      // 拉一次 /status 决定要不要显示麦克风。拿不到就当没有语音，不影响打字
      this.asrInit();
    },
    methods: {
      ...ASR_METHODS,
      ...ASR_STREAM_METHODS,

      /**
       * 麦克风按钮的分发点。模板只认 micStart / micStop，不关心有几个模式。
       *
       * 放页面里而不是 asr.js 里：让 asr.js 反过来引用 asr-stream.js 的方法名，
       * 两个文件就绑死了，少加载一个就是运行时 undefined；放这里一眼能看出有两条路。
       */
      micStart() {
        return this.asrMode === 'stream' ? this.asrStreamStart() : this.asrStart();
      },
      micStop() {
        return this.asrMode === 'stream' ? this.asrStreamStop() : this.asrStop();
      },

      fmtScore,
      scoreClass,
      apply(turn) {
        this.turn = turn;
        this.booting = false;
        if (turn.finished) {
          location.replace('report.html?id=' + turn.recordId);
        }
      },
      async submit() {
        const submitted = this.submitText;
        if (!this.canSubmit) return;
        this.submitting = true;
        try {
          const turn = await api('/api/interview/' + this.recordId + '/answer', {
            method: 'POST',
            body: { answer: submitted }
          });
          this.answer = '';
          // 语音状态也要清，否则下一题还挂着上一题的转写。
          // 流式那条得**把服务端会话也收掉**：会话在服务端手里，不发 stop 就得等它
          // 2 分钟过期回收，而 maxSessions 只有 4 个，试几次就满了
          if (this.asrMode === 'stream') {
            await this.asrStreamStop(true);
          } else {
            this.asrReset();
          }
          this.apply(turn);
        } catch (e) {
          toast(e.message, true);
        } finally {
          this.submitting = false;
        }
      },
      async finish() {
        if (!confirm('确定结束这场面试？结束后会生成本次的综合报告。')) return;
        this.submitting = true;
        try {
          this.apply(await api('/api/interview/' + this.recordId + '/finish', { method: 'POST' }));
        } catch (e) {
          toast(e.message, true);
        } finally {
          this.submitting = false;
        }
      }
    }
  }).mount('#app');
</script>

</body>
</html>
