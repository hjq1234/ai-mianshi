<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面试复盘 · AI 模拟面试</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <div v-html="topbar"></div>

  <div class="container-wide">
    <div v-if="loading" class="card center muted">正在载入复盘数据…</div>

    <div v-else-if="!detail" class="card center">
      <p class="muted">这份复盘没能载入。</p>
      <a href="history.html">回到面试记录</a>
    </div>

    <template v-else>
      <!-- 概览 -->
      <div class="card">
        <div class="row" style="align-items:baseline">
          <h2 style="margin:0">
            {{ detail.position || '技术面试' }}
            <span class="muted" v-if="detail.company">· {{ detail.company }}</span>
          </h2>
          <span class="tag">{{ detail.domain }}</span>
          <span class="tag">{{ detail.difficulty }}</span>
          <span class="muted">{{ fmtTime(detail.createdAt) }}</span>
          <span style="flex:1"></span>
          <span>
            <span class="score" :class="scoreClass(detail.totalScore)">
              {{ fmtScore(detail.totalScore) }}
            </span>
            <span class="muted"> / 10</span>
          </span>
        </div>
        <p class="muted mt8">
          共 {{ detail.dialogues.length }} 题 ·
          覆盖 {{ coveredTopicCount }} 个话题 ·
          {{ detail.status === 'finished' ? '已结束' : '进行中' }}
        </p>
        <div class="mt8" style="display:flex;justify-content:flex-end">
          <button class="ghost small" @click="exportMarkdown">
            导出 Markdown（问题 + 回答 + 评语 + 决策）
          </button>
        </div>
        <!-- 提前结束或引擎跑挂时，这里说明原因 -->
        <div v-if="detail.error" class="feedback mt16"
             style="background:#fdecec;border-color:#f5c2c2">
          {{ detail.error }}
        </div>
      </div>

      <!-- 图表区。雷达和趋势并排，窄屏自动堆叠 -->
      <div class="chart-row">
        <div class="card">
          <h2>能力雷达图</h2>
          <p class="sub">本场五维均分，和历史对比。</p>
          <div id="chart-radar" class="chart"></div>
          <p class="muted" v-if="practiceMissing">本场没有实践分（纯概念题不打分），图中按 0 显示</p>
          <p class="muted" v-else-if="statsFailed">历史均分没取到，只画本场那一条</p>
          <p class="muted" v-else-if="!stats || !stats.finishedCount">还没有答过题的场次，只画本场那一条</p>
        </div>

        <div class="card">
          <h2>分数趋势</h2>
          <p class="sub">每题得分；背景色带是话题分段，虚线是本场均分。</p>
          <div id="chart-trend" class="chart"></div>
        </div>
      </div>

      <!-- 图执行路径：泳道。故意不用 ECharts，见 charts.js 里的说明 -->
      <div class="card">
        <h2>图执行路径</h2>
        <p class="sub">
          引擎每一轮实际走过的节点，最后一步是图做的分支决策。
          引擎跑了 {{ durations.engine }}（就是色块宽度之和，不含你作答的等待），
          从开始到结束是 {{ durations.span }} —— 中间差的就是你思考和离开的时间。
        </p>
        <div id="chart-swimlane" v-html="swimlaneHtml"></div>
      </div>

      <div class="card">
        <h2>话题覆盖度</h2>
        <p class="sub">柱高是该话题均分，按从弱到强排（最弱的在最上面），题数写在右边。</p>
        <div id="chart-topics" class="chart"></div>
      </div>

      <!-- 决策链：图是怎么走的 -->
      <div class="card">
        <h2>图的分支决策链</h2>
        <p class="sub">
          每一轮评分后，图根据得分和话题覆盖度决定下一步。这张表就是那次决策的记录。
        </p>
        <table>
          <thead>
            <tr>
              <th>题号</th><th>话题</th><th>难度</th><th>得分</th>
              <th>图的分支</th><th>说明</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="d in detail.dialogues" :key="d.seq">
              <td>{{ d.seq }}</td>
              <td>{{ d.topic || '-' }}</td>
              <td>{{ d.difficulty || '-' }}</td>
              <td>
                <span class="score" :class="scoreClass(d.score)">{{ fmtScore(d.score) }}</span>
              </td>
              <td>
                <span class="tag" :class="routingTagClass(d.nextAction)">
                  → {{ NEXT_ACTION_LABELS[d.nextAction] || d.nextAction || '-' }}
                </span>
              </td>
              <td class="muted">
                {{ d.comment }}
                <span v-if="d.nextTopic">（换到：{{ d.nextTopic }}）</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 逐题详情：默认全部收起，一题一行。
           原来是 10 个平铺的区块（每题都摊着问/答/评语/五维），一张卡片就一千多 px 高，
           想翻到底下的综合报告得滚很久。收起来后是一张能一眼扫完的列表：
           题号、话题、难度、分数都在，题面只占一行（超出省略），点开才展开全文 -->
      <div class="card">
        <h2>逐题详情</h2>
        <p class="sub">点题号展开，看题目原文、你的回答、评语和五维打分。</p>

        <details class="qa" v-for="d in detail.dialogues" :key="d.seq">
          <summary>
            <span class="qa-seq">第 {{ d.seq }} 题</span>
            <span class="tag">{{ d.topic || '综合' }}</span>
            <span class="tag">{{ d.difficulty || '-' }}</span>
            <span class="qa-question">{{ d.question }}</span>
            <span class="score" :class="scoreClass(d.score)">{{ fmtScore(d.score) }}</span>
          </summary>

          <div class="qa-body">
            <p><span class="muted">问：</span>{{ d.question }}</p>
            <p style="white-space:pre-wrap">
              <span class="muted">答：</span>{{ d.answer || '（未作答）' }}
            </p>
            <p v-if="d.comment"><span class="muted">评语：</span>{{ d.comment }}</p>

            <div class="dim-grid" v-if="d.dimensions">
              <div class="dim-item" v-for="(v, k) in d.dimensions" :key="k">
                <span class="k">{{ DIMENSION_LABELS[k] || k }}</span>
                <span class="v">{{ fmtScore(v) }}</span>
              </div>
            </div>
          </div>
        </details>
      </div>

      <!-- 综合报告 -->
      <div class="card">
        <h2>AI 综合报告</h2>
        <div class="report" v-if="detail.report" v-html="renderMarkdown(detail.report)"></div>
        <div v-else class="muted">这场面试还没结束，结束之后才会有综合报告。</div>
      </div>
    </template>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script src="js/app.js"></script>
<script src="js/charts.js"></script>
<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        topbar: topbarHtml('history.html'),
        detail: null,
        // 历史均分。取不到时保持 null：雷达图只画本场，其余三张图不受影响
        stats: null,
        statsFailed: false,
        // 泳道图是拼出来的 HTML 串（不是 ECharts），所以放 data 里给 v-html
        swimlaneHtml: '',
        loading: true,
        DIMENSION_LABELS,
        NEXT_ACTION_LABELS
      };
    },
    computed: {
      coveredTopicCount() {
        if (!this.detail) return 0;
        return new Set(this.detail.dialogues.map(d => d.topic).filter(Boolean)).size;
      },
      // 两个用时都显示。早先只显示记录跨度，理由是「作答的等待没有 trace」，
      // 这在连着答完的场次上没问题（跨度 24 分钟 ≈ 引擎 7 分钟 + 作答 17 分钟），
      // 但隔天续答的那场跨度是 885 分钟，「整场用时约 886 分钟」读起来像面了 14 小时。
      // 引擎耗时正好等于泳道色块宽度之和，跟图对得上，所以两个都给
      durations() {
        const d = reportDurations(this.detail);
        return {
          engine: fmtMinutes(msToMinutes(d.engineMs)),
          span: fmtMinutes(msToMinutes(d.spanMs))
        };
      },
      // 本场一道题都没打出实践分。雷达图按 0 画了，得说明一句，
      // 不然看图的人会以为「实践能力是 0 分」
      practiceMissing() {
        const list = this.detail ? this.detail.dialogues : [];
        return list.length > 0 && !list.some(d => d.dimensions && d.dimensions.practice != null);
      }
    },
    async mounted() {
      if (!requireLogin()) return;

      const id = new URLSearchParams(location.search).get('id');
      if (!id) {
        location.replace('history.html');
        return;
      }

      fillNickname();
      try {
        // 复盘只用这一个接口：逐题评分 + 决策链 + 轨迹 + 五维均分都在里面
        this.detail = await api('/api/interview/' + id + '/detail');
      } catch (e) {
        toast(e.message, true);
      }

      // 历史均分单独拿，失败也只降级雷达图，不能让整页打不开
      try {
        this.stats = await api('/api/interview/stats');
      } catch (e) {
        this.statsFailed = true;
      }

      this.loading = false;
      if (this.detail) {
        this.swimlaneHtml = traceSwimlaneHtml(this.detail.traces);
        // 图表容器在 v-else 模板里，得等这一轮 DOM 更新完才有元素可 init
        await this.$nextTick();
        this.drawCharts();
        // ECharts 不会自己跟着容器变宽，窗口一变要重新量
        window.addEventListener('resize', this.resizeCharts);
      }
    },
    methods: {
      fmtTime,
      fmtScore,
      scoreClass,
      renderMarkdown,
      drawCharts() {
        renderRadar(document.getElementById('chart-radar'), {
          current: this.detail.dimensionAverages,
          history: this.stats ? this.stats.dimensions : null,
          historyCount: this.stats ? this.stats.finishedCount : 0
        });
        renderScoreTrend(document.getElementById('chart-trend'), this.detail.dialogues);
        renderTopicCoverage(document.getElementById('chart-topics'), this.detail.dialogues);
      },
      resizeCharts() {
        if (typeof echarts === 'undefined') return;
        document.querySelectorAll('.chart').forEach(el => {
          const instance = echarts.getInstanceByDom(el);
          if (instance) instance.resize();
        });
      },
      // buildReportMarkdown / downloadTextFile / safeFileName 是 app.js 里的全局函数，
      // 直接调用即可，不用再往 data/methods 上挂一份
      exportMarkdown() {
        if (!this.detail) return;
        const d = this.detail;
        const stamp = fmtTime(d.createdAt).replace(/[-: ]/g, '');
        const name = safeFileName(`面试复盘-${d.position || '技术面试'}-${stamp}`);
        downloadTextFile(name + '.md', buildReportMarkdown(d));
        toast('已导出 ' + name + '.md');
      },
      routingTagClass(action) {
        if (action === 'deepen') return 'success';
        if (action === 'lower') return 'warning';
        if (action === 'end') return 'primary';
        return '';
      }
    }
  }).mount('#app');
</script>

</body>
</html>
