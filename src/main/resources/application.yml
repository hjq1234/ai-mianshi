server:
  port: 8080

spring:
  application:
    name: ai-mianshi
  datasource:
    url: jdbc:sqlite:./data/interview.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      # busy_timeout 是「每连接」生效的，所以放在 connection-init-sql 里
      connection-init-sql: PRAGMA busy_timeout=5000
  sql:
    init:
      # 配合 schema.sql 里的 CREATE TABLE IF NOT EXISTS，每次启动都执行且幂等
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  auth:
    # 部署时务必换掉，改成足够长的随机串
    secret: change-me-before-deploy-please
    ttl-hours: 72
  llm:
    # DeepSeek 的 OpenAI 兼容端点。换通义/豆包/Kimi 只改这三行
    base-url: ${DEEPSEEK_URL:}
    # 本地调试用环境变量：export DEEPSEEK_API_KEY=xxx。
    # ★ 不要把 key 写回这个文件——它会被提交进 git
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4.1-flash
    temperature: 0.7
    connect-timeout-seconds: 10
    read-timeout-seconds: 120
  asr:
    # 语音识别用的本地模型目录。模型是 228 MB，放在仓库外，所以这里填的是绝对路径。
    #
    # 写成 ${环境变量:默认值} 的形式，两种做法都留着：
    #   不设 APP_ASR_MODEL_DIR → 用冒号后面这个默认值（IDEA 直接 Run 就能跑，不用配环境变量）
    #   设了                   → 环境变量赢，换机器/换模型目录时不用动这个文件
    #
    # 目录不存在或为空时应用照常启动，只是 /api/asr/status 返 available:false、
    # 答题区不显示麦克风。启动日志会打一行说明是哪种情况（见 AsrConfig）
    model-dir: ${APP_ASR_MODEL_DIR:D:/models/sense-voice}
    # 流式那一套。和上面是两套模型、两条独立的代码路径，目录也各配各的：
    # 离线那个 SenseVoice 228 MB（带标点和数字规整），流式这个 zipformer 161 MB（都没带）
    stream:
      # 目录跟机器绑，就写在这儿；里面那几个模型文件名跟模型绑、对所有人都一样，
      # 所以放在 AsrProperties.Stream 的字段默认值里，不占 yml 的行
      model-dir: ${APP_ASR_STREAM_MODEL_DIR:D:/models/sherpa-onnx-streaming-zipformer-zh-int8-2025-06-30}
    # 其余字段（modelFile / tokensFile / numThreads / maxSeconds / language /
    # inverseTextNormalization / debug）都有能用的默认值，要改就在这里加同名 kebab-case 行
  interview:
    max-questions: 15
    # 同一话题最多问几题，问满强制换话题（算的是本话题答过几轮，不只是 deepen）
    max-follow-up: 3
    max-steps: 200
    # 这个话题的出题会带上 hint_practice：问真实项目/场景，practice 维度才有依据
    practice-topic: 项目经历
    # 话题池：switch 节点从这里挑没聊过的话题
    topics:
      Java:
        - 项目经历
        - JVM 内存模型
        - 并发编程
        - 集合框架
        - Spring 原理
        - MySQL
        - Redis
      Go:
        - 项目经历
        - GMP 调度模型
        - 内存管理与 GC
        - channel 与并发
        - 运行时与逃逸分析
      Python:
        - 项目经历
        - GIL 与并发模型
        - 装饰器与元编程
        - 异步 asyncio
        - 内存管理与垃圾回收
    默认:
      - 项目经历
      - 基础知识
      - 系统设计
      - 排查与优化

logging:
  level:
    com.ke.nhservice.aimianshi: DEBUG